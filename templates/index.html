<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>麻雀スコア計算</title>
</head>
<body>

<h2>麻雀スコア（10-30ウマ）</h2>

<form method="POST">
    {% for i in range(4) %}
        <div>
            名前:
            <input type="text" name="names" value="{{ names[i] }}">
            点数:
            <input type="number" name="scores" value="{{ scores[i] }}">
            結果:
            {{ results[i] }}
        </div>
        <br>
    {% endfor %}

    <button type="submit">計算</button>
</form>

</body>
</html>
