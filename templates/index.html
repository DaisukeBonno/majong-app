<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀スコア</title>

<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f3d2e">

<style>
body {
    margin: 0;
    font-family: -apple-system;
    background: #0b2e22;
    color: white;
}

.header {
    position: sticky;
    top: 0;
    background: #0f3d2e;
    padding: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.card {
    background: #145c43;
    margin: 10px;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

.result {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
}

.plus { color: #4cd964; }
.minus { color: #ff453a; }

.total {
    font-size: 20px;
    font-weight: bold;
}

button {
    width: calc(100% - 20px);
    margin: 10px;
    padding: 15px;
    background: #34c759;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    color: white;
}

.history {
    margin: 10px;
    padding: 10px;
    background: #0f3d2e;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="header">
第{{ round_num }}回戦
</div>

<form method="POST">

{% for i in range(4) %}
<div class="card">
    <input type="text" name="name" value="{{ names[i] }}">
    <input type="number" name="score" value="{{ scores[i] }}">

    <div class="result">
        <span>今回</span>
        <span class="{{ 'plus' if results[i]>0 else 'minus' }}">
            {{ results[i] }}
        </span>
    </div>

    <div class="result total">
        <span>累計</span>
        <span>{{ totals[i] }}</span>
    </div>
</div>
{% endfor %}

<button type="submit">次の半荘 ▶</button>

</form>

<div class="history">
<h3>履歴</h3>
{% for game in history %}
<div>第{{ loop.index }}回戦 : {{ game }}</div>
{% endfor %}
<a href="/reset" style="color:white;">リセット</a>
</div>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/service-worker.js");
}
</script>

</body>
</html>
