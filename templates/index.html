<div class="header">
第{{ round_num }}回戦
</div>

<div class="container">

<form method="POST">

{% for i in range(4) %}
<div class="card">
    <input type="text" name="name" value="{{ names[i] }}">
    <input type="number" name="score" value="{{ scores[i] }}">

    <div class="result">
        今回: {{ results[i] }}
    </div>

    <div>
        累計: {{ totals[i] }}
    </div>
</div>
{% endfor %}

<button type="submit">次の半荘へ</button>

</form>

<hr>

<h3>履歴</h3>

{% for game in history %}
<div>
第{{ loop.index }}回戦 :
{{ game }}
</div>
{% endfor %}

<a href="/reset">リセット</a>

</div>
