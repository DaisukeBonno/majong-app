<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀スコア</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">
    <h1>麻雀スコア（10-30ウマ）</h1>

    <form method="POST">

        {% for i in range(4) %}
        <div class="card">
            <input type="text" name="name" value="{{names[i]}}" class="name">
            <input type="number" name="score" value="{{scores[i]}}" class="score">
            <div class="result">{{results[i]}}</div>
        </div>
        {% endfor %}

        <button type="submit">計算</button>
    </form>
</div>

</body>
</html>
